<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vue Todo</title>
<style>
* { box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #0f1117; color: #e6edf3; display: flex; justify-content: center; min-height: 100vh; }
#app { width: 100%; max-width: 480px; padding: 2rem; }
h1 { color: #42d392; text-align: center; }
.input-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
input[type="text"] { flex: 1; padding: 10px 14px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 14px; outline: none; }
input[type="text"]:focus { border-color: #42d392; }
button { padding: 10px 20px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
.add-btn { background: #42d392; color: #0f1117; font-weight: 600; }
.add-btn:hover { background: #65e0a5; }
.todo-list { list-style: none; padding: 0; }
.todo-item { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #21262d; }
.todo-item:last-child { border-bottom: none; }
.todo-text { flex: 1; cursor: pointer; }
.todo-text.done { text-decoration: line-through; color: #8b949e; }
.del-btn { background: transparent; color: #f85149; font-size: 16px; padding: 4px 8px; border: none; cursor: pointer; }
.del-btn:hover { background: rgba(248,81,73,0.1); border-radius: 4px; }
.empty { text-align: center; color: #8b949e; padding: 2rem; }
input[type="checkbox"] { accent-color: #42d392; cursor: pointer; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
