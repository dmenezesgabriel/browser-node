<!DOCTYPE html>
<html ng-app="todoApp">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AngularJS Todo</title>
<script src="/angular.js"></script>
<script src="/app.js"></script>
<style>
* { box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; padding: 2rem; max-width: 480px; margin: 0 auto; background: #0f1117; color: #e6edf3; }
h1 { color: #e0344a; text-align: center; }
.input-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
input[type="text"] { flex: 1; padding: 10px 14px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 14px; outline: none; }
input[type="text"]:focus { border-color: #e0344a; }
button { padding: 10px 20px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
.add-btn { background: #e0344a; color: #fff; font-weight: 600; }
.add-btn:hover { background: #c62828; }
ul { list-style: none; padding: 0; }
li { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #21262d; }
li:last-child { border-bottom: none; }
li span { flex: 1; cursor: pointer; }
li span.done { text-decoration: line-through; color: #8b949e; }
.del-btn { background: transparent; color: #f85149; font-size: 16px; padding: 4px 8px; border: none; cursor: pointer; }
.del-btn:hover { background: rgba(248,81,73,0.1); border-radius: 4px; }
.empty { text-align: center; color: #8b949e; padding: 2rem; }
input[type="checkbox"] { accent-color: #e0344a; cursor: pointer; }
</style>
</head>
<body ng-controller="TodoController">
<h1>AngularJS Todos</h1>
<div class="input-row">
<input type="text" ng-model="inputText" placeholder="What needs to be done?" ng-keyup="$event.key==='Enter' && addTodo()">
<button class="add-btn" ng-click="addTodo()">Add</button>
</div>
<p ng-if="todos.length === 0" class="empty">No todos yet. Add one above!</p>
<ul ng-if="todos.length > 0">
<li ng-repeat="todo in todos track by todo.id">
<input type="checkbox" ng-model="todo.completed" ng-change="toggleTodo(todo)">
<span ng-class="{ done: todo.completed }" ng-click="toggleTodo(todo)">{{ todo.text }}</span>
<button class="del-btn" ng-click="deleteTodo(todo.id)">&times;</button>
</li>
</ul>
</body>
</html>
